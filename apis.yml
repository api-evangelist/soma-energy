aid: soma-energy
name: Soma Energy
description: >-
  Soma Energy is an AI-powered energy intelligence platform that optimizes how
  power is produced, stored, and consumed. Founded by former Amazon and
  technology leaders, it coordinates power generation, battery storage, and
  large energy consumers such as data centers. Its Intelligence Platform
  combines three products: AI Trader, which automates energy procurement,
  hedging, and dispatch for independent power producers (IPPs); BESS Dispatcher,
  which manages battery energy storage systems; and Load Optimizer, which
  coordinates data-center workloads with grid conditions to cut energy costs and
  turn facilities into flexible grid assets. Soma Energy is an early-stage
  company backed by Uncork Capital. As of this profile the company exposes no
  public API, developer platform, or documentation.
